<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melsta Beauty Companion — Prototype</title>
<style>
:root{--ink:#29252b;--muted:#77717a;--line:#eee8ed;--bg:#faf8fa;--pink:#d95f91;--pink2:#f8e7ef;--plum:#6f4b68;--lav:#eee9f6;--peach:#fbefe8;--white:#fff;--shadow:0 12px 35px #3423350d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 35px}.mark{width:38px;height:38px;border-radius:13px;background:var(--pink2);color:var(--pink);display:grid;place-items:center;font:italic 29px Georgia}.brand b{font:600 24px Georgia;letter-spacing:-1px}.brand small{display:block;font-size:8px;letter-spacing:1.3px;color:#9b8795}.navlabel,.eyebrow,.step{font-size:10px;letter-spacing:1.4px;color:#a18e9b;font-weight:700}.navlabel{padding:0 12px 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;color:#716873;display:flex;gap:12px;align-items:center}.nav button.active{background:var(--pink2);color:#9d3f6d;font-weight:700}.nav button span{width:18px;text-align:center;font-size:17px}.sidefoot{margin-top:auto;background:#fbf4f8;border-radius:14px;padding:15px;color:#806c7b}.sidefoot b{color:#65475d}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px}.crumb{color:#a096a0;font-size:12px}.crumb b{color:#443b45}.topright{display:flex;align-items:center;gap:18px;color:#988d98;font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;background:#f3dce8;color:#9e4d76;display:grid;place-items:center;font-weight:700}.content{max-width:1250px;margin:auto;padding:34px 38px 50px}.hero{background:linear-gradient(115deg,#f9e9f0,#f5eff8 62%,#f9eee8);border-radius:22px;padding:44px 48px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;min-height:300px;overflow:hidden}.hero h1{font:500 clamp(38px,5vw,58px)/1.04 Georgia;margin:15px 0}.hero h1 em,.intro h1 em{color:#bd5d8a;font-weight:400}.hero p,.intro p{color:#766d78;max-width:510px}.primary{border:0;background:#bd5d8a;color:#fff;border-radius:9px;padding:12px 19px;font-weight:650;margin-top:12px}.heroart{justify-self:center;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#fff 0 22%,#efcbdc 23% 45%,#d9c8e7 46% 70%,#ead8df 71%);display:grid;place-items:center;color:#a95b82;font:italic 58px Georgia;position:relative}.heroart:after{content:'✧';position:absolute;right:10px;top:5px;font:35px Georgia;color:#fff}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.tile,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.tile{padding:19px;text-align:left}.tile .ico{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--pink2);color:#b24f80;font-size:18px;margin-bottom:13px}.tile b{display:block}.tile p{font-size:12px;color:var(--muted);min-height:48px}.tile small{color:#b24f80;font-weight:700}.intro{margin:4px 0 25px}.intro h1{font:500 38px Georgia;margin:9px 0}.layout{display:grid;grid-template-columns:1.35fr .8fr;gap:18px}.panel{padding:23px}.panel h3{font:500 21px Georgia;margin:7px 0 18px}.step{display:block}.tabs,.chips,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button,.chip,.filters button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;color:#746a76;font-size:12px}.tabs button.on,.chip.on,.filters button.on{background:var(--pink2);border-color:#edc6d8;color:#9d3f6d}.looks,.products,.pros{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.look{border:1px solid var(--line);background:#fff;border-radius:12px;padding:15px;text-align:left}.look.on{border-color:#d77aa3;background:#fff8fb}.look strong,.look small{display:block}.look small{color:var(--muted);font-size:11px;margin-top:5px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;font-weight:650;color:#655b67}.field input,.field textarea,.field select,.url{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff;outline-color:#d77aa3}.field textarea{min-height:95px;resize:vertical}.upload{border:1px dashed #d9bfd0;background:#fdf8fb;border-radius:13px;padding:22px;text-align:center;color:#8b6c81}.upload input{max-width:100%;margin-top:10px}.preview{background:linear-gradient(150deg,#f9edf3,#f3eff8);border-radius:14px;min-height:250px;display:grid;place-items:center;text-align:center;padding:20px;color:#8c5878}.preview .face{font-size:72px}.preview h3{margin:8px 0 4px;color:#443844}.muted{color:var(--muted);font-size:12px}.full{width:100%}.note{background:#faf5f8;border-radius:10px;padding:12px;color:#81717e;font-size:11px;margin-top:15px}.decode{display:grid;gap:10px}.decodeitem{border:1px solid var(--line);border-radius:10px;padding:12px}.decodeitem b{display:block;font-size:10px;letter-spacing:1px;color:#b15c87}.product{border:1px solid var(--line);border-radius:13px;overflow:hidden}.productart{height:110px;background:linear-gradient(140deg,#f8e8ef,#f1eaf7);display:grid;place-items:center;font-size:35px;color:#a95b82}.productbody{padding:12px}.productbody small{color:#9a8191}.productbody b{display:block;margin:4px 0}.productbody a{color:#b24f80;font-weight:700;text-decoration:none}.pro{padding:15px;border:1px solid var(--line);border-radius:13px}.pro .monogram{width:48px;height:48px;border-radius:50%;background:#f3e2ed;display:grid;place-items:center;color:#9f4c78;font:18px Georgia;margin-bottom:10px}.pro p{color:var(--muted);font-size:12px}.check{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.saved{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:22px;right:22px;background:#342b36;color:white;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow)}.footer{border-top:1px solid var(--line);padding:18px 38px;color:#a096a0;font-size:10px;display:flex;justify-content:space-between}.hidden{display:none!important}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 6px 10px}.sidefoot,.navlabel{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.top{padding:0 18px}.content{padding:22px 16px}.hero{padding:28px;grid-template-columns:1fr}.heroart{display:none}.tiles{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.footer{padding:15px}}
@media(max-width:520px){.tiles,.looks,.products,.pros{grid-template-columns:1fr}.hero h1{font-size:42px}.topright .tagline{display:none}.intro h1{font-size:31px}}
</style>
</head>
<body><div class="shell"><aside class="side"><div class="brand"><div class="mark">m</div><div><b>melsta</b><small>YOUR BEAUTY COMPANION</small></div></div><div class="navlabel">YOUR BEAUTY SPACE</div><nav class="nav" id="nav"></nav><div class="sidefoot">✧ A little more you.<br><b>A whole lot more confident.</b></div></aside><main class="main"><header class="top"><div class="crumb">Your beauty space&nbsp; / &nbsp;<b id="crumb">Home</b></div><div class="topright"><span class="tagline">Your look, your way ♡</span><div class="avatar">M</div></div></header><div class="content" id="view"></div><footer class="footer"><span>© 2026 MELSTA BEAUTY COMPANION</span><span>One platform. One personalised look. Everything to bring it to life.</span></footer></main></div><div id="toast" class="toast hidden"></div>
<script>
const pages=[['Home','⌂'],['AI Beauty Studio','✧'],['Reel to Look','▧'],['Shop the Look','♡'],['Find a Pro','✿'],['My Beauty Plan','▤']];let page='Home',mode='Guided look',vibe='Soft romantic',occasion='Wedding guest',brief='',refURL='',selfieURL='',inspoURL='',inspoImage='',decoded=false,generated=false,filter='All',saved=[2,5],checks=[true,false,false,false],city='Bengaluru';
const products=[['Soft Glam Skin Tint','Kay Beauty','₹1,199','Base','✧','https://www.nykaa.com/search/result/?q=Kay%20Beauty%20skin%20tint'],['Nude Mauve Lipstick','M·A·C','₹2,550','Lips','♡','https://www.nykaa.com/search/result/?q=MAC%20mauve%20lipstick'],['Champagne Glow Highlighter','e.l.f.','₹850','Glow','✦','https://www.amazon.in/s?k=elf+highlighter'],['Rosewood Blush','Rare Beauty','₹2,900','Cheeks','❀','https://www.nykaa.com/search/result/?q=Rare%20Beauty%20blush'],['Pearl Drop Earrings','Accessorize','₹1,290','Jewellery','◇','https://www.myntra.com/earrings'],['Satin Hair Bow','Accessorize','₹790','Hair','୨୧','https://www.myntra.com/hair-accessories']];const looks=[['The Blushing Bride','Fresh skin · rosy cheeks · soft shimmer','🌷','Soft romantic'],['Golden Hour Muse','Bronzed glow · warm eyes · nude lips','☀️','Warm glam'],['Modern Maharani','Defined eyes · statement lip · timeless','👑','Classic glam'],['Petal-Soft Minimal','Barely-there base · flushed lips · dew','🪷','Minimal']];const artists=[['Aanya Mehra','Bridal & soft glam MUA','Bengaluru','4.9','128','From ₹8,000','AM'],['Ira Kapoor','Editorial & occasion makeup','Mumbai','4.8','96','From ₹6,500','IK'],['Sana Joseph','Hair, draping & makeup','Bengaluru','5.0','74','From ₹7,500','SJ']];
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p){page=p;render()}function nav(){document.getElementById('nav').innerHTML=pages.map(([p,i])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${p}</button>`).join('');document.getElementById('crumb').textContent=page}
function intro(k,t,d){return `<div class="intro"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div>`}function filePreview(e,key){let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);if(key==='ref')refURL=u;if(key==='selfie')selfieURL=u;if(key==='inspo')inspoImage=u;render()}
function home(){return `<section class="hero"><div><div class="eyebrow">YOUR PERSONAL BEAUTY COMPANION</div><h1>Every detail,<br><em>beautifully</em> you.</h1><p>From the first spark of inspiration to the final finishing touch — create a look that feels like you, and bring every part of it together.</p><button class="primary" onclick="go('AI Beauty Studio')">Create my look&nbsp; ↗</button></div><div class="heroart">✿</div></section><div class="tiles"><button class="tile" onclick="go('AI Beauty Studio')"><span class="ico">✧</span><b>Create your look</b><p>Explore guided styles, upload a reference or describe your own vision.</p><small>Open AI Studio →</small></button><button class="tile" onclick="go('Reel to Look')"><span class="ico">▧</span><b>Decode inspiration</b><p>Turn a social post or screenshot into an editable beauty plan.</p><small>Reel to Look →</small></button><button class="tile" onclick="go('Shop the Look')"><span class="ico">♡</span><b>Shop your look</b><p>Discover makeup, jewellery and finishing touches.</p><small>Explore products →</small></button><button class="tile" onclick="go('Find a Pro')"><span class="ico">✿</span><b>Find your artist</b><p>Explore beauty professionals, styles and sample portfolios.</p><small>Meet the pros →</small></button></div><section class="panel"><div class="step">THE COMPLETE BEAUTY JOURNEY</div><h3>One look, from idea to getting-ready day.</h3><p class="muted">Create and refine your look · try a virtual styling experience · shop products and accessories · discover a professional · keep everything in one shareable plan.</p><button class="primary" onclick="go(&quot;My Beauty Plan&quot;)">View my beauty plan →</button></section>`}
function studio(){
const directions={
'Soft romantic':{makeup:'Fresh, luminous base · rosy blush · soft champagne shimmer · rose-nude lips',hair:'Loose waves or a soft low bun with face-framing pieces',jewellery:'Pearl drops or delicate rose-gold earrings',finish:'A soft, glowy finish that feels effortless and romantic'},
'Warm glam':{makeup:'Warm bronzed base · terracotta blush · bronze eyes · caramel nude lips',hair:'Bouncy waves or a sleek high ponytail',jewellery:'Gold hoops or sculptural gold earrings',finish:'Sun-kissed warmth with softly defined eyes'},
'Classic glam':{makeup:'Smooth satin base · defined liner · softly sculpted cheeks · classic rose or red lip',hair:'Polished bun or structured Hollywood waves',jewellery:'Statement earrings with a clean neckline',finish:'Timeless, polished and photo-ready'},
'Minimal':{makeup:'Light base · brushed brows · subtle mascara · muted pink lips',hair:'Natural texture or a neat low ponytail',jewellery:'Tiny studs and fine chains',finish:'Fresh, understated and comfortable'},
'Modern chic':{makeup:'Velvety skin · softly smoked eyes · neutral sculpting · mauve lips',hair:'Sleek middle-part bun or smooth straight hair',jewellery:'Minimal geometric metal pieces',finish:'Clean lines with one intentional statement'},
'Fresh dewy':{makeup:'Sheer radiant base · cream blush · glossy lids · tinted balm',hair:'Air-dried waves or a relaxed half-up style',jewellery:'Delicate, light-catching pieces',finish:'A fresh, hydrated, barely-there look'},
'Bold editorial':{makeup:'Defined complexion · graphic or smoky eyes · statement lip',hair:'Sleek sculptural updo or strong polished waves',jewellery:'One bold accessory; keep the rest simple',finish:'High-impact and expressive'}
};
const d=directions[vibe]||directions['Soft romantic'];
const result=generated?`<section class="panel" id="lookResult" style="margin-top:18px;border-color:#e8bfd2;background:#fffafd">
<span class="step">YOUR PERSONAL BEAUTY DIRECTION</span>
<h3 style="font-size:25px;margin-bottom:5px">${esc(vibe)} for ${esc(occasion)}</h3>
<p class="muted">Here’s your starter look plan. You can change any part of it.</p>
<div class="decode">
${[['MAKEUP',d.makeup],['HAIR',d.hair],['JEWELLERY & ACCESSORIES',d.jewellery],['THE OVERALL FEEL',d.finish]].map(x=>`<div class="decodeitem"><b>${x[0]}</b>${x[1]}</div>`).join('')}
${brief?`<div class="decodeitem"><b>YOUR NOTES</b>${esc(brief)}</div>`:''}
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
<button class="primary" onclick="go('Shop the Look')">Find products for this look →</button>
<button class="primary" style="background:#f5e5ed;color:#93466c" onclick="go(&quot;My Beauty Plan&quot;)">Save to my beauty plan ♡</button>
</div>
<p class="muted" style="margin-top:12px">Demo guidance: this prototype creates a sample beauty direction from your choices. It does not yet use a live AI model to analyse your photo or generate a transformed selfie.</p>
</section>`:'';
return `${intro('AI BEAUTY STUDIO','Create a look that feels like you.','Choose one style, tell us your occasion, then press the button to get a simple look plan.')}
<div class="layout">
<section class="panel">
<span class="step">STEP 1 · PICK A STARTING LOOK</span>
<h3>Which style feels most like you?</h3>
<div class="looks">${looks.map(l=>`<button class="look ${vibe===l[3]?'on':''}" onclick="vibe='${l[3]}';generated=false;render()"><span style="font-size:25px">${l[2]}</span><strong>${l[0]}</strong><small>${l[1]}</small></button>`).join('')}</div>
<div class="field"><label>STEP 2 · What are you getting ready for?</label>
<select id="occasion" onchange="occasion=this.value;generated=false">${['Wedding guest','Bridal','Engagement','Festive celebration','Party','Everyday','Photoshoot','Other'].map(x=>`<option ${occasion===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>STEP 3 · Anything else we should know? (optional)</label>
<textarea id="brief" placeholder="Example: I’m wearing a pink saree and want a soft, elegant look.">${esc(brief)}</textarea>
</div>
<button class="primary full" onclick="brief=document.getElementById('brief').value;occasion=document.getElementById('occasion').value;generated=true;render();setTimeout(()=>document.getElementById('lookResult')?.scrollIntoView({behavior:'smooth',block:'start'}),80)">✨ Build my look plan</button>
<p class="muted" style="margin-top:10px">No need to upload anything to get started. You can add a reference photo later.</p>
</section>
<aside class="panel">
<span class="step">YOUR LOOK PREVIEW</span>
<div class="preview"><div><div class="face">${selfieURL?`<img src="${selfieURL}" style="width:150px;height:150px;object-fit:cover;border-radius:50%">`:'♡'}</div><div>✧ &nbsp; ♡ &nbsp; ✧</div></div></div>
<h3>${generated?esc(vibe):'Your look will appear here'}</h3>
<p class="muted">${generated?`${esc(occasion)} · Your starter beauty direction is ready below.`:'Pick a style and click “Build my look plan”. We’ll show makeup, hair and accessory ideas.'}</p>
${generated?'<button class="primary full" onclick="go(&quot;My Beauty Plan&quot;)">Open my beauty plan →</button>':''}
<div class="note">Want to see the look on your own face? Upload a selfie in the optional try-on section below. Realistic AI face rendering is not connected in this demo.</div>
</aside>
</div>
${result}
<div class="panel" style="margin-top:18px">
<span class="step">OPTIONAL · ADD YOUR PHOTO</span><h3>Have a reference photo or selfie?</h3>
<p class="muted">You can upload one for the concept preview. This demo can display your photo, but it does not digitally apply makeup to your face.</p>
<div class="upload"><input type="file" accept="image/*" onchange="filePreview(event,'ref')">${refURL?`<p><img src="${refURL}" style="max-width:180px;max-height:180px;border-radius:12px"></p>`:''}</div>
</div>`;
}
function reel(){return `${intro('INSPO, DECODED','Save the vibe. Make it yours.','Paste a social link or upload screenshots. Turn the details you love into an editable beauty plan.')}<div class="layout"><section class="panel"><span class="step">01 / ADD YOUR INSPIRATION</span><h3>Where did you find your look?</h3><div class="field"><label>Instagram, Pinterest or other public link</label><input class="url" id="inspo" placeholder="Paste your inspiration URL" value="${esc(inspoURL)}" oninput="inspoURL=this.value"></div><div class="upload"><b>Or upload screenshots / key frames</b><p class="muted">Clear images help identify makeup, hair, jewellery and outfit details.</p><input type="file" accept="image/*" multiple onchange="filePreview(event,'inspo')">${inspoImage?`<p><img src="${inspoImage}" style="max-width:100%;max-height:180px;border-radius:10px"></p>`:''}</div><button class="primary full" onclick="decoded=true;render()">Decode this look ✧</button><p class="muted">Private or restricted social content may not be accessible. Upload screenshots or key frames if a video cannot be analysed.</p></section><section class="panel"><span class="step">02 / EDITABLE LOOK NOTES</span>${decoded?`<h3>Your inspiration board is taking shape.</h3><div class="decode">${[['MAKEUP','Rosy, softly sculpted base · defined lashes'],['HAIR','Loose waves or a polished low bun'],['JEWELLERY','Pearl or delicate gold accents'],['OUTFIT','A tonal look with one statement detail']].map(x=>`<div class="decodeitem"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div><button class="primary" onclick="brief='Rosy softly sculpted base, defined lashes, loose waves and pearl accents.';mode='Describe my look';go('AI Beauty Studio')">Edit this in AI Studio →</button>`:`<div class="preview"><div><div class="face">♡</div><h3>Your look breakdown will appear here.</h3><p class="muted">We’ll organise inspiration into makeup, hair, jewellery and outfit details.</p></div></div>`}<div class="note">Product and brand identification from images can be uncertain. Similar purchasable options can be suggested when exact products cannot be confirmed.</div></section></div>`}
function shop(){let kinds=['All','Base','Lips','Cheeks','Glow','Jewellery','Hair'],shown=products.filter(p=>filter==='All'||p[3]===filter);return `${intro('SHOP THE LOOK','The details that bring it all together.','Explore makeup, jewellery and accessories to recreate or personalise your look.')}<div class="filters">${kinds.map(k=>`<button class="${filter===k?'on':''}" onclick="filter='${k}';render()">${k}</button>`).join('')}</div><div class="products">${shown.map(p=>`<article class="product"><div class="productart">${p[4]}</div><div class="productbody"><small>${p[1]} · ${p[3]}</small><b>${p[0]}</b><div style="display:flex;justify-content:space-between;align-items:center"><strong>${p[2]}</strong><a href="${p[5]}" target="_blank" rel="noreferrer">Shop ↗</a></div><button style="border:0;background:none;color:#b24f80;padding:8px 0" onclick="saved.includes(${products.indexOf(p)+1})?saved=saved.filter(x=>x!==${products.indexOf(p)+1}):saved.push(${products.indexOf(p)+1});toast('Wishlist updated ♡')">${saved.includes(products.indexOf(p)+1)?'♥ Saved':'♡ Save'}</button></div></article>`).join('')}</div><div class="note">Prices and availability are illustrative sample data. Retailer links open search pages; live product catalogues, prices and inventory would need retailer integrations.</div>`}
function pros(){return `${intro('PROFESSIONAL DISCOVERY','Find the right artist for your moment.','Explore beauty professionals by their style and location, then start an enquiry.')}<div class="field" style="max-width:360px"><label>Search city or area</label><input value="${esc(city)}" oninput="city=this.value" onchange="render()"></div><div class="pros">${artists.map(a=>`<article class="pro"><div class="monogram">${a[6]}</div><b>${a[0]}</b><p>${a[1]}</p><p>⌖ ${a[2]} · ★ ${a[3]} (${a[4]} reviews)</p><strong>${a[5]}</strong><p><button class="primary" onclick="toast('Enquiry draft started for ${a[0]}. Booking is not connected.')">Enquire ↗</button></p><span class="muted">Sample portfolio profile</span></article>`).join('')}</div><div class="note">Artist names, portfolios, ratings, reviews and pricing are sample content. A live marketplace needs verified profiles, reviews and booking integration.</div>`}
function plan(){let chosen=products.filter((p,i)=>saved.includes(i+1));return `${intro('YOUR PERSONAL LOOKBOOK','Everything for your event, in one place.','Keep your look direction, saved finds and getting-ready checklist together.')}<div class="layout"><section class="panel"><span class="step">YOUR EVENT LOOK</span><h3>${esc(occasion)}</h3><div class="preview" style="min-height:140px"><div><div class="face">✿</div><b>${generated?esc(vibe):'Your beauty story starts here'}</b><p class="muted">${esc(brief||'Create a look in AI Studio to add your personal direction.')}</p></div></div><h3 style="margin-top:22px">Getting-ready checklist</h3>${['Finalise makeup direction','Choose jewellery & accessories','Shortlist a beauty professional','Share the final beauty brief'].map((x,i)=>`<label class="check"><input type="checkbox" ${checks[i]?'checked':''} onchange="checks[${i}]=this.checked">${x}</label>`).join('')}</section><aside><section class="panel"><span class="step">YOUR WISHLIST</span><h3>Saved for later ♡</h3>${chosen.length?chosen.map(p=>`<div class="saved"><span>${p[0]}</span><b>${p[2]}</b></div>`).join(''):'<p class="muted">Save products from the shop to see them here.</p>'}<button class="primary" onclick="go('Shop the Look')">Explore products →</button></section><section class="panel" style="margin-top:16px;background:#f8eaf1"><span class="step">YOUR LOOK, ALL TOGETHER</span><h3>Share your beauty brief</h3><p class="muted">Take your vision to your artist or keep it close for the big day.</p><button class="primary" onclick="copyBrief()">Copy my beauty brief ↗</button></section></aside></div>`}
function copyBrief(){let s=`MELSTA BEAUTY BRIEF\nOccasion: ${occasion}\nLook direction: ${vibe}\nInspiration: ${brief||'Personalised to my occasion and preferences'}\nSaved products: ${products.filter((p,i)=>saved.includes(i+1)).map(p=>p[0]).join(', ')||'To be decided'}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>toast('Beauty brief copied ✨')).catch(()=>toast(s));else toast('Copy is unavailable in this browser')}
function render(){nav();let v=page==='Home'?home():page==='AI Beauty Studio'?studio():page==='Reel to Look'?reel():page==='Shop the Look'?shop():page==='Find a Pro'?pros():plan();document.getElementById('view').innerHTML=v}
render();
</script></body></html>
